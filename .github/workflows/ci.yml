name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ can-utils iproute2

      # Without a real vcan interface the CanSource tests skip rather than fail,
      # so CI would stay green while the only Linux-specific ingest path in the
      # project went untested.
      - name: Bring up vcan0
        run: |
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          ./scripts/setup-vcan.sh 1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DETG_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Smoke
        run: ./build/src/etg-gateway --source synth --consumer smoke:9099 --seconds 1

      # First test that exercises the generator at all: it needs a CAN
      # interface, which the WSL2 dev kernel cannot provide.
      - name: Smoke over vcan (generator to tap)
        run: ./scripts/smoke-vcan.sh build

  # Verifies on day one that the runner can provide a real vcan interface, rather
  # than discovering it at step 3. If this job ever fails, CanSource loses its CI
  # coverage and the risk moves to the Pi.
  vcan-available:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install can-utils and the vcan module
        run: |
          sudo apt-get update
          sudo apt-get install -y can-utils iproute2
          # The Azure kernel on GitHub runners does not ship vcan; it lives in
          # linux-modules-extra for the running kernel.
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          uname -r
          find /lib/modules -name 'vcan*'

      - name: Bring up vcan0..vcan3
        run: ./scripts/setup-vcan.sh 4

      - name: Prove a frame round-trips through the kernel
        run: |
          timeout 5 candump -n 1 vcan0 &
          sleep 1
          cansend vcan0 123#DEADBEEF
          wait %1

  # Separate job because TSan and ASan cannot be combined, and because a
  # sanitized binary must never be used for a performance number: TSan costs
  # 5-15x time and 5-10x memory.
  #
  # vcan is deliberately not set up here. The CanSource tests are not concurrent,
  # so they would only add runtime; the build job already covers them.
  tsan:
    runs-on: ubuntu-latest
    env:
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++

      - name: Configure
        run: cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DETG_SANITIZER=tsan -DETG_WERROR=ON

      - name: Build
        run: cmake --build build-tsan

      - name: Test under ThreadSanitizer
        run: ctest --test-dir build-tsan --output-on-failure
