# Gateway and its consumers as separate containers.
#
#   docker compose up
#       Synthetic source on an ordinary bridge network. Works on Docker Desktop
#       (Windows, macOS) as well as on Linux. Open http://localhost:8080/ for
#       the live view.
#
#   sudo ./scripts/setup-vcan.sh 1
#   docker compose -f docker-compose.yml -f docker-compose.vcan.yml --profile vcan up
#       Real SocketCAN. Linux hosts only - the override explains why.
#
# Networking here is the compose default: a project network with DNS, so the
# consumers reach the gateway by service name and only the view publishes a
# port. Host networking is confined to the vcan override, where the kernel
# forces it rather than it being a choice.
#
# What this does demonstrate: separate processes, separate filesystems, separate
# lifecycles, speaking the documented protocol over real TCP. What it does not
# demonstrate is a boundary between machines - that is M3, where a probe runs
# over the LAN and the clock-domain problem stops being theoretical.

x-etg: &etg
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: etg:local
  restart: unless-stopped

services:
  gateway:
    <<: *etg
    container_name: etg-gateway
    # Publishes nothing on purpose. The consumer ports are an internal protocol
    # between these services, not a public interface.
    command:
      - etg-gateway
      - --source
      - ${ETG_SOURCE:-synth}
      - --rate
      - ${ETG_RATE:-5000}
      - --queue
      - ${ETG_QUEUE:-8192}
      - --consumer
      - probe:9001
      - --consumer
      - recorder:9002
      - --consumer
      - view:9003
      - --consumer
      - cadence:9004

  # Every consumer reconnects on its own, so compose start order does not matter
  # and a gateway restart is survived rather than being a fatal race. That is the
  # behaviour under test, not a workaround for it.
  probe:
    <<: *etg
    container_name: etg-probe
    depends_on: [gateway]
    command:
      - etg-probe
      - --host
      - ${ETG_GATEWAY_HOST:-gateway}
      - --port
      - "9001"
      - --reconnect
      - --warmup
      - "2"

  recorder:
    <<: *etg
    container_name: etg-recorder
    depends_on: [gateway]
    volumes:
      - etg-data:/data
    command:
      - etg-record
      - --host
      - ${ETG_GATEWAY_HOST:-gateway}
      - --port
      - "9002"
      - --reconnect
      - --out
      - /data/capture.etg

  # The live view is a consumer like any other: it reaches the gateway only
  # through the documented protocol, with no debug hook and no side channel.
  # It is the one service that publishes a port, because it is the one meant to
  # be opened by a person.
  view:
    <<: *etg
    container_name: etg-view
    depends_on: [gateway]
    ports:
      - "${ETG_HTTP_PORT:-8080}:8080"
    command:
      - etg-view
      - --host
      - ${ETG_GATEWAY_HOST:-gateway}
      - --port
      - "9003"
      - --http
      - "8080"

  # The consumer that makes the case for gap markers: it measures inter-arrival
  # time per CAN id, so loss it does not know about looks exactly like a bus
  # going quiet. Run it with --gap-blind alongside this one to see the
  # difference; the same stream produced 64 anomalies blind against 6 aware.
  cadence:
    <<: *etg
    container_name: etg-cadence
    depends_on: [gateway]
    command:
      - etg-cadence
      - --host
      - ${ETG_GATEWAY_HOST:-gateway}
      - --port
      - "9004"
      - --reconnect

  # Only started with --profile vcan, and only useful together with the vcan
  # override, which is what puts it in the namespace where vcan0 exists.
  generator:
    <<: *etg
    container_name: etg-gen
    profiles: [vcan]
    restart: "no"
    cap_add:
      - NET_RAW
    command:
      - etg-gen
      - --interface
      - ${ETG_IFACE:-vcan0}
      - --rate
      - ${ETG_RATE:-5000}
      - --seconds
      - ${ETG_SECONDS:-30}

volumes:
  etg-data:
