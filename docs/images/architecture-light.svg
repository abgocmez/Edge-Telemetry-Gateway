<svg xmlns="http://www.w3.org/2000/svg" width="820" height="386" viewBox="0 0 820 386" role="img" aria-label="Architecture diagram. Two CAN buses feed ingest threads that claim cells in a shared broadcast ring with a compare-and-swap. Three consumers in separate containers each read the same cells through their own cursor over TCP; a cursor that falls a full lap behind is overwritten, which is counted as drop-oldest and reported to that consumer as a gap marker."><title>One ring, one copy, a cursor per consumer</title><desc>Architecture diagram. Two CAN buses feed ingest threads that claim cells in a shared broadcast ring with a compare-and-swap. Three consumers in separate containers each read the same cells through their own cursor over TCP; a cursor that falls a full lap behind is overwritten, which is counted as drop-oldest and reported to that consumer as a gap marker.</desc><rect width="820" height="386" fill="#fcfcfb"/><text x="24.0" y="30.0" fill="#0b0b0b" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">One ring, one copy, a cursor per consumer</text><text x="24.0" y="50.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">Why the gateway uses a broadcast ring rather than a queue per consumer.</text><rect x="24" y="150" width="96" height="40" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.5"/><text x="72.0" y="171.0" fill="#0b0b0b" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">bus 0</text><text x="72.0" y="185.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" text-anchor="middle">vcan0</text><line x1="124.0" y1="170.0" x2="172.0" y2="196.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><path d="M172.0,196.0 L164.2,195.7 L167.5,189.6 Z" fill="#2a78d6"/><rect x="24" y="212" width="96" height="40" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.5"/><text x="72.0" y="233.0" fill="#0b0b0b" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">bus 1</text><text x="72.0" y="247.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" text-anchor="middle">vcan1</text><line x1="124.0" y1="232.0" x2="172.0" y2="196.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><path d="M172.0,196.0 L168.5,203.0 L164.3,197.4 Z" fill="#2a78d6"/><text x="150.0" y="250.0" fill="#52514e" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">ingest</text><text x="150.0" y="264.0" fill="#52514e" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">threads</text><text x="186.0" y="130.0" fill="#0b0b0b" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start">broadcast ring</text><text x="186.0" y="146.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start">fixed cells, each with its own sequence number</text><rect x="186" y="176" width="30" height="42" rx="3" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><rect x="191" y="189" width="20" height="16" rx="2" fill="#e1e0d9"/><rect x="218" y="176" width="30" height="42" rx="3" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><rect x="223" y="189" width="20" height="16" rx="2" fill="#e1e0d9"/><rect x="250" y="176" width="30" height="42" rx="3" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><rect x="255" y="189" width="20" height="16" rx="2" fill="#e1e0d9"/><rect x="282" y="176" width="30" height="42" rx="3" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><rect x="287" y="189" width="20" height="16" rx="2" fill="#e1e0d9"/><rect x="314" y="176" width="30" height="42" rx="3" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><rect x="319" y="189" width="20" height="16" rx="2" fill="#e1e0d9"/><rect x="346" y="176" width="30" height="42" rx="3" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><rect x="351" y="189" width="20" height="16" rx="2" fill="#e1e0d9"/><rect x="378" y="176" width="30" height="42" rx="3" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><rect x="383" y="189" width="20" height="16" rx="2" fill="#e1e0d9"/><rect x="410" y="176" width="30" height="42" rx="3" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><rect x="415" y="189" width="20" height="16" rx="2" fill="#e1e0d9"/><rect x="442" y="176" width="30" height="42" rx="3" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><rect x="447" y="189" width="20" height="16" rx="2" fill="#e1e0d9"/><rect x="474" y="176" width="30" height="42" rx="3" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><rect x="479" y="189" width="20" height="16" rx="2" fill="#e1e0d9"/><rect x="506" y="176" width="30" height="42" rx="3" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><rect x="538" y="176" width="30" height="42" rx="3" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><line x1="489.0" y1="156.0" x2="489.0" y2="172.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><path d="M489.0,172.0 L485.5,165.0 L492.5,165.0 Z" fill="#2a78d6"/><text x="479.0" y="158.0" fill="#52514e" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="end">producers claim the next cell with a CAS</text><line x1="457.0" y1="248.0" x2="457.0" y2="224.0" stroke="#1baf7a" stroke-width="1.5" stroke-linecap="round"/><path d="M457.0,224.0 L460.5,231.0 L453.5,231.0 Z" fill="#1baf7a"/><circle cx="457.0" cy="254.0" r="4.0" fill="#1baf7a"/><line x1="393.0" y1="248.0" x2="393.0" y2="224.0" stroke="#1baf7a" stroke-width="1.5" stroke-linecap="round"/><path d="M393.0,224.0 L396.5,231.0 L389.5,231.0 Z" fill="#1baf7a"/><circle cx="393.0" cy="254.0" r="4.0" fill="#1baf7a"/><line x1="233.0" y1="248.0" x2="233.0" y2="224.0" stroke="#eb6834" stroke-width="1.5" stroke-linecap="round"/><path d="M233.0,224.0 L236.5,231.0 L229.5,231.0 Z" fill="#eb6834"/><circle cx="233.0" cy="254.0" r="4.0" fill="#eb6834"/><text x="186.0" y="280.0" fill="#52514e" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start">each consumer holds its own cursor: the frame is stored once and read N times</text><text x="186.0" y="298.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start">a cursor a full lap behind is overwritten — drop-oldest, counted, and reported to that consumer as a gap marker</text><line x1="574.0" y1="197.0" x2="614.0" y2="138.0" stroke="#1baf7a" stroke-width="1.5" stroke-linecap="round"/><path d="M614.0,138.0 L613.0,145.8 L607.2,141.8 Z" fill="#1baf7a"/><rect x="620" y="118" width="118" height="40" rx="6" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.5"/><text x="679.0" y="139.0" fill="#0b0b0b" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">recorder</text><text x="679.0" y="153.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" text-anchor="middle">appends to disk</text><line x1="574.0" y1="197.0" x2="614.0" y2="200.0" stroke="#1baf7a" stroke-width="1.5" stroke-linecap="round"/><path d="M614.0,200.0 L606.8,203.0 L607.3,196.0 Z" fill="#1baf7a"/><rect x="620" y="180" width="118" height="40" rx="6" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.5"/><text x="679.0" y="201.0" fill="#0b0b0b" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">live view</text><text x="679.0" y="215.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" text-anchor="middle">serves HTTP</text><line x1="574.0" y1="197.0" x2="614.0" y2="262.0" stroke="#eb6834" stroke-width="1.5" stroke-linecap="round"/><path d="M614.0,262.0 L607.4,257.9 L613.3,254.2 Z" fill="#eb6834"/><rect x="620" y="242" width="118" height="40" rx="6" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/><text x="679.0" y="263.0" fill="#0b0b0b" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">cadence</text><text x="679.0" y="277.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" text-anchor="middle">falling behind</text><text x="620.0" y="100.0" fill="#52514e" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start">separate containers, TCP</text><text x="24.0" y="368.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start">A queue per consumer would copy every frame once per consumer, and order in a queue is push order — so ingest could not be spread across threads at all.</text></svg>
