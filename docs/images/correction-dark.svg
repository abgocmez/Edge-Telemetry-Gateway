<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" role="img" aria-label="Dumbbell chart. Every tail figure fell once the probe stopped sorting its own sample buffer inside the loop it was measuring."><title>Every tail figure, re-measured</title><desc>Dumbbell chart. Every tail figure fell once the probe stopped sorting its own sample buffer inside the loop it was measuring.</desc><rect width="720" height="392" fill="#1a1a19"/><text x="20.0" y="26.0" fill="#ffffff" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Every tail figure, re-measured</text><text x="20.0" y="44.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">Ring topology, same board and load. Log scale.</text><text x="20.0" y="61.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start">The 2 000/s rows barely move, and p99 moves the wrong way: too few samples there for the bug to bite.</text><circle cx="532.0" cy="40.0" r="5.0" fill="#898781"/><text x="542.0" y="44.0" fill="#c3c2b7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start">before</text><circle cx="594.0" cy="40.0" r="5.0" fill="#3987e5"/><text x="604.0" y="44.0" fill="#c3c2b7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start">after</text><line x1="205.5" y1="68.0" x2="205.5" y2="358.0" stroke="#2c2c2a" stroke-width="1" stroke-linecap="round"/><text x="205.5" y="374.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">