<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" role="img" aria-label="Log-log line chart of p50, p90, p99 and p99.9 latency at 2 000, 20 000 and 100 000 frames per second."><title>Latency against offered rate</title><desc>Log-log line chart of p50, p90, p99 and p99.9 latency at 2 000, 20 000 and 100 000 frames per second.</desc><rect width="660" height="400" fill="#fcfcfb"/><text x="20.0" y="28.0" fill="#0b0b0b" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Latency against offered rate</text><text x="20.0" y="46.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">Raspberry Pi 3 B+, ring topology, one consumer. Both axes logarithmic.</text><line x1="76.0" y1="279.2" x2="564.0" y2="279.2" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="64.0" y="283.2" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="end">100 µs</text><line x1="76.0" y1="121.5" x2="564.0" y2="121.5" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="64.0" y="125.5" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="end">1.0 ms</text><line x1="76.0" y1="342.0" x2="564.0" y2="342.0" stroke="#c3c2b7" stroke-width="1" stroke-linecap="round"/><text x="76.0" y="364.0" fill="#52514e" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">2 000/s</text><text x="363.2" y="364.0" fill="#52514e" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">20 000/s</text><text x="564.0" y="364.0" fill="#52514e" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">100 000/s</text><path d="M76.0,270.1 L363.2,307.5 L564.0,303.6" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="76.0" cy="270.1" r="6.5" fill="#fcfcfb"/><circle cx="76.0" cy="270.1" r="4.5" fill="#2a78d6"/><circle cx="363.2" cy="307.5" r="6.5" fill="#fcfcfb"/><circle cx="363.2" cy="307.5" r="4.5" fill="#2a78d6"/><circle cx="564.0" cy="303.6" r="6.5" fill="#fcfcfb"/><circle cx="564.0" cy="303.6" r="4.5" fill="#2a78d6"/><circle cx="578.0" cy="308.5" r="4.5" fill="#2a78d6"/><text x="588.0" y="312.5" fill="#52514e" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">p50</text><path d="M76.0,263.4 L363.2,294.7 L564.0,289.6" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="76.0" cy="263.4" r="6.5" fill="#fcfcfb"/><circle cx="76.0" cy="263.4" r="4.5" fill="#eb6834"/><circle cx="363.2" cy="294.7" r="6.5" fill="#fcfcfb"/><circle cx="363.2" cy="294.7" r="4.5" fill="#eb6834"/><circle cx="564.0" cy="289.6" r="6.5" fill="#fcfcfb"/><circle cx="564.0" cy="289.6" r="4.5" fill="#eb6834"/><circle cx="578.0" cy="293.5" r="4.5" fill="#eb6834"/><text x="588.0" y="297.5" fill="#52514e" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">p90</text><path d="M76.0,250.8 L363.2,266.2 L564.0,278.5" fill="none" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="76.0" cy="250.8" r="6.5" fill="#fcfcfb"/><circle cx="76.0" cy="250.8" r="4.5" fill="#1baf7a"/><circle cx="363.2" cy="266.2" r="6.5" fill="#fcfcfb"/><circle cx="363.2" cy="266.2" r="4.5" fill="#1baf7a"/><circle cx="564.0" cy="278.5" r="6.5" fill="#fcfcfb"/><circle cx="564.0" cy="278.5" r="4.5" fill="#1baf7a"/><circle cx="578.0" cy="278.5" r="4.5" fill="#1baf7a"/><text x="588.0" y="282.5" fill="#52514e" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">p99</text><path d="M76.0,234.9 L363.2,235.5 L564.0,104.4" fill="none" stroke="#eda100" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="76.0" cy="234.9" r="6.5" fill="#fcfcfb"/><circle cx="76.0" cy="234.9" r="4.5" fill="#eda100"/><circle cx="363.2" cy="235.5" r="6.5" fill="#fcfcfb"/><circle cx="363.2" cy="235.5" r="4.5" fill="#eda100"/><circle cx="564.0" cy="104.4" r="6.5" fill="#fcfcfb"/><circle cx="564.0" cy="104.4" r="4.5" fill="#eda100"/><circle cx="578.0" cy="104.4" r="4.5" fill="#eda100"/><text x="588.0" y="108.4" fill="#52514e" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">p99.9</text><text x="20.0" y="382.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start">p50 and p90 fall as the board wakes up, then hold. Only p99.9 lifts at 100 000/s, and there it is queueing.</text></svg>
