<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" role="img" aria-label="Line chart across p50, p90, p99 and p99.9 for four scheduling arms: contended, idle, contended under SCHED_FIFO, and the same with mlockall."><title>One busy loop per core, and what priority does about it</title><desc>Line chart across p50, p90, p99 and p99.9 for four scheduling arms: contended, idle, contended under SCHED_FIFO, and the same with mlockall.</desc><rect width="660" height="400" fill="#1a1a19"/><text x="20.0" y="28.0" fill="#ffffff" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">One busy loop per core, and what priority does about it</text><text x="20.0" y="46.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">20 000 frames/s on the ring. No frames were lost in any arm.</text><line x1="76.0" y1="342.0" x2="450.0" y2="342.0" stroke="#2c2c2a" stroke-width="1" stroke-linecap="round"/><text x="64.0" y="346.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="end">100 µs</text><line x1="76.0" y1="210.0" x2="450.0" y2="210.0" stroke="#2c2c2a" stroke-width="1" stroke-linecap="round"/><text x="64.0" y="214.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="end">1.0 ms</text><line x1="76.0" y1="78.0" x2="450.0" y2="78.0" stroke="#2c2c2a" stroke-width="1" stroke-linecap="round"/><text x="64.0" y="82.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="end">10 ms</text><line x1="76.0" y1="342.0" x2="450.0" y2="342.0" stroke="#383835" stroke-width="1" stroke-linecap="round"/><text x="76.0" y="364.0" fill="#c3c2b7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">p50</text><text x="200.7" y="364.0" fill="#c3c2b7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">p90</text><text x="325.3" y="364.0" fill="#c3c2b7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">p99</text><text x="450.0" y="364.0" fill="#c3c2b7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">p99.9</text><path d="M76.0,290.1 L200.7,157.0 L325.3,122.0 L450.0,107.8" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="76.0" cy="290.1" r="6.5" fill="#1a1a19"/><circle cx="76.0" cy="290.1" r="4.5" fill="#3987e5"/><circle cx="200.7" cy="157.0" r="6.5" fill="#1a1a19"/><circle cx="200.7" cy="157.0" r="4.5" fill="#3987e5"/><circle cx="325.3" cy="122.0" r="6.5" fill="#1a1a19"/><circle cx="325.3" cy="122.0" r="4.5" fill="#3987e5"/><circle cx="450.0" cy="107.8" r="6.5" fill="#1a1a19"/><circle cx="450.0" cy="107.8" r="4.5" fill="#3987e5"/><line x1="456.0" y1="107.8" x2="462.0" y2="107.8" stroke="#383835" stroke-width="1" stroke-linecap="round"/><circle cx="466.0" cy="107.8" r="4.5" fill="#3987e5"/><text x="476.0" y="111.8" fill="#c3c2b7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">contended</text><path d="M76.0,325.6 L200.7,305.8 L325.3,292.7 L450.0,256.2" fill="none" stroke="#d95926" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="76.0" cy="325.6" r="6.5" fill="#1a1a19"/><circle cx="76.0" cy="325.6" r="4.5" fill="