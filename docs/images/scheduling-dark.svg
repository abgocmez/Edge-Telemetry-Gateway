5" fill="#c98500"/><circle cx="325.3" cy="295.1" r="6.5" fill="#1a1a19"/><circle cx="325.3" cy="295.1" r="4.5" fill="#c98500"/><circle cx="450.0" cy="292.5" r="6.5" fill="#1a1a19"/><circle cx="450.0" cy="292.5" r="4.5" fill="#c98500"/><line x1="456.0" y1="292.5" x2="462.0" y2="308.7" stroke="#383835" stroke-width="1" stroke-linecap="round"/><circle cx="466.0" cy="308.7" r="4.5" fill="#c98500"/><text x="476.0" y="312.7" fill="#c3c2b7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">+ mlockall</text><text x="20.0" y="382.0" fill="#898781" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start">Contention costs 20x at p99. Real-time priority gives all of it back; locking memory adds nothing.</text></svg>
